<!DOCTYPE html>
<html>

<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    body {
      background: #05070f;
      color: #e6edf8;
      font-family: Inter, sans-serif;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #0b0e17;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 8px;
    }

    .panel {
      background: #0b0e17;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="grid" id="top-row"></div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
    <div class="panel">
      <h3>Top CVEs</h3>
      <div id="cve-list"></div>
    </div>
    <div class="panel">
      <h3>Compliance Trends</h3><canvas id="compChart"></canvas>
    </div>
  </div>
  <script>
    async function load() {
      const res = await fetch('/api/data');
      const d = await res.json();
      document.getElementById('top-row').innerHTML = `
        <div class="card">Score: ${d.securityScore}</div>
        <div class="card">CVEs: ${d.unpatchedCVEs}</div>
        <div class="card">Linux CIS: ${d.cisLinuxPct}%</div>
        <div class="card">EKS CIS: ${d.cisEksPct}%</div>
      `;
      document.getElementById('cve-list').innerHTML = d.vulnerabilityList.map(v => `<div>${v.name} - ${v.severity}</div>`).join('');
      new Chart(document.getElementById('compChart'), {
        type: 'line',
        data: { labels: ['Apr 12', 'Apr 19', 'Apr 26', 'May 03', 'May 09'], datasets: [{ label: 'CIS EKS', data: [48, 48, 48, 48, 48], borderColor: '#3b82f6' }] }
      });
    }
    load();
  </script>
</body>

</html>
